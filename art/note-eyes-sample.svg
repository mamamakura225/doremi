<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
  <!-- 符頭に目を付けるかの見本（#100・オーナー判断待ち）。上段=目なし（採用中）、下段=目あり。
       符頭の寸法（rx17・ry13・-20°）は実物どおり、五線の間隔は見本用に半分（25）。 -->
  <defs>
    <radialGradient id="puff" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff" stop-opacity="0.75"/>
      <stop offset="0.45" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.12"/>
    </radialGradient>
    <g id="head">
      <ellipse rx="17" ry="13" stroke="#5b524b" stroke-width="2.5" transform="rotate(-20)"/>
      <ellipse rx="16" ry="12" fill="url(#puff)" transform="rotate(-20)"/>
    </g>
    <g id="eyes" fill="#3d3530">
      <ellipse cx="-5.5" cy="-1" rx="2.2" ry="2.8"/>
      <ellipse cx="5.5" cy="-3" rx="2.2" ry="2.8"/>
      <circle cx="-4.8" cy="-2.2" r="0.9" fill="#fff"/>
      <circle cx="6.2" cy="-4.2" r="0.9" fill="#fff"/>
    </g>
    <line id="stem" x1="15" y1="-2" x2="15" y2="-70" stroke="#5b524b" stroke-width="4" stroke-linecap="round"/>
  </defs>
  <rect width="640" height="300" fill="#fffdf5"/>
  <text x="20" y="28" font-size="18" fill="#6b6375" font-family="sans-serif">目なし（採用中）</text>
  <text x="20" y="178" font-size="18" fill="#6b6375" font-family="sans-serif">目あり（案）</text>
  <g stroke="#5b524b" stroke-width="2">
    <line x1="20" y1="60" x2="620" y2="60"/><line x1="20" y1="85" x2="620" y2="85"/><line x1="20" y1="110" x2="620" y2="110"/>
    <line x1="20" y1="210" x2="620" y2="210"/><line x1="20" y1="235" x2="620" y2="235"/><line x1="20" y1="260" x2="620" y2="260"/>
  </g>
  <!-- 上段: 目なし -->
  <g transform="translate(120 110)"><use href="#stem"/><use href="#head" fill="#e23b3b"/></g>
  <g transform="translate(240 97.5)"><use href="#stem"/><use href="#head" fill="#facc15"/></g>
  <g transform="translate(360 85)"><use href="#stem"/><use href="#head" fill="#38bdf8"/></g>
  <g transform="translate(480 72.5)"><use href="#stem"/><use href="#head" fill="#a78bfa"/></g>
  <!-- 下段: 目あり -->
  <g transform="translate(120 260)"><use href="#stem"/><use href="#head" fill="#e23b3b"/><use href="#eyes"/></g>
  <g transform="translate(240 247.5)"><use href="#stem"/><use href="#head" fill="#facc15"/><use href="#eyes"/></g>
  <g transform="translate(360 235)"><use href="#stem"/><use href="#head" fill="#38bdf8"/><use href="#eyes"/></g>
  <g transform="translate(480 222.5)"><use href="#stem"/><use href="#head" fill="#a78bfa"/><use href="#eyes"/></g>
</svg>
